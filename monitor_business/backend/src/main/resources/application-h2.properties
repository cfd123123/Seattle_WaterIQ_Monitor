# Use when PostgreSQL is unavailable: java -jar app.jar --spring.profiles.active=h2
# Or: SPRING_PROFILES_ACTIVE=h2
server.port=8080

water.ai.base-url=http://localhost:8000
water.alert.threshold=4

spring.datasource.url=jdbc:h2:file:./data/waterdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
