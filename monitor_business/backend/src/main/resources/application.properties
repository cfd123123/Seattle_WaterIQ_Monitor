server.port=8080

# Auto-forecast: when enabled, runs 00060/63680 trend forecasts for registered sites with non-empty externalId (same behavior as /api/forecast/series).
spring.task.scheduling.pool.size=1
# Spring 6 cron: second minute hour day month weekday; default 02:00 daily (server timezone).
water.auto-forecast.cron=0 0 2 * * ?
# Bind all IPv4 interfaces so Tomcat is reachable on 127.0.0.1 (some setups only listen on IPv6 ::1 otherwise).
server.address=0.0.0.0

water.ai.base-url=http://localhost:8000

# Feign: single predict/series calls can be slow; a short read timeout causes sporadic Read timed out in batch jobs (defaults are often ~60s).
spring.cloud.openfeign.client.config.waterForecastClient.connect-timeout=10000
spring.cloud.openfeign.client.config.waterForecastClient.read-timeout=180000

# When saving/updating a station with external_id (USGS site_no), whether to verify existence via the AI (:8000) NWIS proxy (set false for offline/dev).
water.usgs.verify-external-id-on-save=true

# After numeric pollution score, score >= this threshold persists alert_event (1=Excellent … 5=Very Poor; see PollutionLevelThresholds).
water.alert.threshold=4

# Default PostgreSQL; override with Spring Boot env vars: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/water_monitor
spring.datasource.username=water
spring.datasource.password=water

spring.application.name=water-business

# Actuator + Prometheus (V4.1 metrics); restrict /actuator in production (network or Security).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# HTTP server latency histogram (for Prometheus histogram_quantile).
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- V4.2 tracing: OTLP export disabled by default (avoids noisy Failed to export spans when Tempo :4318 is not running). ---
# For Tempo/Grafana: docker compose up -d tempo, then start Spring with spring.profiles.active=otlp.
management.tracing.sampling.probability=1.0
management.otlp.tracing.export.enabled=false
# Feign outbound spans (with feign-micrometer).
spring.cloud.openfeign.observation.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Use profile spring.profiles.active=h2 when PostgreSQL is unavailable (see application-h2.properties).

# Max stats query window in days (inclusive start/end).
water.stats.max-range-days=365

# Local/dev only: when true, registers POST /api/demo/seed-fake-alerts for fake stations and alerts (e.g. TopN tests).
water.demo-seed.enabled=true

# USGS 63680 turbidity: alert only when two consecutive IV rows (~15 min) exceed the same tier; severe: last point >= critical and previous >= warn.
water.turbidity-threshold.enabled=true
water.turbidity-threshold.cron=0 */15 * * * ?
water.turbidity-threshold.warn-ntu=50
water.turbidity-threshold.critical-ntu=100
water.turbidity-threshold.dedup-hours=6
# water.turbidity-threshold.iv-csv-path=

# USGS 63680 four-state monitoring (Python POST /turbidity/state/snapshot); Cedar 12117500 features CSV.
water.turbidity-state.enabled=true
water.turbidity-state.cron=0 */30 * * * ?
water.turbidity-state.dedup-hours=6
water.turbidity-state.features-csv-path=data/features_12117500_63680_openmeteo_upstream_2022.csv
# water.turbidity-state.thresholds-json-path=reports/turbidity_state/12117500_v2/state_thresholds.json
water.turbidity-state.monitored-site-nos=12117500
water.turbidity-state.alert-on-tier-watch=true
water.turbidity-state.alert-on-tier-high=true
water.turbidity-state.alert-on-tier-critical=true
water.turbidity-state.alert-on-state-high=false
water.turbidity-state.alert-on-state-rising=false
water.turbidity-state.alert-on-rule-horizon6=true
water.turbidity-state.alert-on-rule-horizon12=true

# Phase B: 12h turbidity alert-risk forecast (persistence; paths relative to ai_service)
water.turbidity-risk-forecast.features-csv-path=data/features_12117500_63680_openmeteo_upstream_2022.csv
water.turbidity-risk-forecast.thresholds-json-path=reports/turbidity_state/12117500_v2/state_thresholds.json

# Feign read timeout for ai_service (state snapshot can take ~20s on full history).
spring.cloud.openfeign.client.config.waterAiMaintenanceClient.connect-timeout=10000
spring.cloud.openfeign.client.config.waterAiMaintenanceClient.read-timeout=180000

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Resilience4j: AI call retries (initial attempt + 3 retries, 500ms apart).
# Short-horizon forecast Feign retry (same policy as predict).
resilience4j.retry.instances.waterAiForecastRetry.max-attempts=4
resilience4j.retry.instances.waterAiForecastRetry.wait-duration=500ms
resilience4j.retry.instances.waterAiForecastRetry.enable-exponential-backoff=false
resilience4j.retry.instances.waterAiForecastRetry.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

# USGS IV refresh Feign retry (NWIS occasional timeouts).
resilience4j.retry.instances.waterAiUsgsIvRefreshRetry.max-attempts=4
resilience4j.retry.instances.waterAiUsgsIvRefreshRetry.wait-duration=500ms
resilience4j.retry.instances.waterAiUsgsIvRefreshRetry.enable-exponential-backoff=false
resilience4j.retry.instances.waterAiUsgsIvRefreshRetry.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

# Redis cache (Phase 2): hot path for /api/stats/trend.
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
water.cache.trend-ttl-seconds=60

# RabbitMQ (Phase 3): batch forecast tasks only.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
water.mq.forecast.exchange=water.task.exchange
water.mq.forecast.queue=water.forecast.batch
water.mq.forecast.routing-key=forecast.batch.run
# Dead letter: listener throws or reject without requeue -> DLX -> DLQ (configure x-dead-letter-* on the queue).
water.mq.forecast.dlx-exchange=water.task.dlx
water.mq.forecast.dlq-queue=water.forecast.batch.dlq
water.mq.forecast.dlq-routing-key=forecast.batch.dlq

# RabbitMQ listener: cap concurrency and prefetch to avoid flooding AI (:8000).
# prefetch: max unacked messages per consumer (in-flight ~= prefetch * consumer count).
# concurrency / max-concurrency: consumer thread pool bounds (Spring may scale within the range).
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=3
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=3
# Do not requeue failed messages to the business queue (infinite loop); pair with DLQ above.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Batch forecast already retries in application code; disable container-level redelivery to avoid fighting DB task state.
spring.rabbitmq.listener.simple.retry.enabled=false

# Async task cleanup: keep recent records only (terminal statuses), default retain 7 days.
water.async-task-retention.enabled=true
water.async-task-retention.days=7
water.async-task-retention.cron=0 20 3 * * ?
