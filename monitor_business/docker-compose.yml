# 本地环境：PostgreSQL + Tempo + Grafana（V4.2 链路与 4.1 指标面板）
# postgres: docker compose up -d postgres
# 可观测栈: docker compose up -d tempo prometheus grafana
# Spring Boot 默认已关闭 OTLP 导出；起 Tempo 后请加 --spring.profiles.active=otlp 再上报到 4318。Grafana http://localhost:3000（匿名 Admin）
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: water
      POSTGRES_PASSWORD: water
      POSTGRES_DB: water_monitor
    volumes:
      - water_monitor_pgdata:/var/lib/postgresql/data

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

  # Grafana 的 Prometheus 数据源需要真正的 Prometheus HTTP API（/api/v1/*），不能直接把 URL 指到 Actuator 文本端点
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tempo
      - prometheus

volumes:
  water_monitor_pgdata:
