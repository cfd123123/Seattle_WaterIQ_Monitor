# Tempo (traces) + Prometheus (metrics query API).
# Scrape targets are not configured here; see ../../../prometheus/prometheus.yml (default: monitor-service:8080/actuator/prometheus on the Compose network).
# Point Grafana at Prometheus (/api/v1/*), not at Spring Actuator URLs.
apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false

  - name: Prometheus
    type: prometheus
    uid: prom
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
