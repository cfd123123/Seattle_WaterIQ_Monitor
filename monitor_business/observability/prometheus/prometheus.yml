# Scrape monitor-service in the same Docker network as the business stack (use when full compose stack is up).
# If Spring runs only on the host without the monitor-service container, set targets to e.g. host.docker.internal:18080.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - monitor-service:8080
