# Prometheus 抓取宿主机上的 Spring Boot Actuator（需本机先启动应用 :8080）
# Docker 内使用 host.docker.internal（Linux 需在 compose 中为 prometheus 配置 extra_hosts: host-gateway）
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - host.docker.internal:8080
