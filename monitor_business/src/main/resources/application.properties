server.port=8080

# 自动预测：开启后对「已登记且 externalId 非空」站点各跑 00060/63680 趋势预测（与 /api/forecast/series 一致）
spring.task.scheduling.pool.size=1
# Spring 6 域 cron：秒 分 时 日 月 周；默认每日 02:00（服务器时区）
water.auto-forecast.cron=0 0 2 * * ?
# 显式绑定 IPv4 全接口，避免个别环境下 Tomcat 仅监听 IPv6(::1)，导致向 127.0.0.1 发起的连接被拒绝
server.address=0.0.0.0

water.ai.base-url=http://localhost:8000

# Feign：单次预测/序列可能较慢；读超时过短会导致批量任务中偶发 Read timed out（默认常约 60s）
spring.cloud.openfeign.client.config.waterForecastClient.connect-timeout=10000
spring.cloud.openfeign.client.config.waterForecastClient.read-timeout=180000

# 登记/更新站点时若填写 external_id（USGS site_no），是否经 AI(:8000) 代理查询 NWIS 校验站点存在（false 仅适用于离线/联调）
water.usgs.verify-external-id-on-save=true

# 污染等级数值化后，score >= 该值则写入 alert_event（1=Excellent … 5=Very Poor，见 PollutionLevelThresholds）
water.alert.threshold=4

# 默认 PostgreSQL；可用环境变量覆盖（Spring Boot 标准）：SPRING_DATASOURCE_URL、SPRING_DATASOURCE_USERNAME、SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/water_monitor
spring.datasource.username=water
spring.datasource.password=water

spring.application.name=water-business

# Actuator + Prometheus（V4.1 指标）；生产环境请对 /actuator 做网络或 Security 隔离
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# HTTP 服务端延迟直方图（便于 Prometheus histogram_quantile）
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- V4.2 链路追踪：默认不向 OTLP 上报（本机未起 Tempo :4318 时会反复报 Failed to export spans，与业务无关）---
# 需要 Tempo/Grafana 时：先 docker compose up -d tempo，再启动 Spring 并加 profile：spring.profiles.active=otlp
management.tracing.sampling.probability=1.0
management.otlp.tracing.export.enabled=false
# Feign 出站 span（与 feign-micrometer 配合）
spring.cloud.openfeign.observation.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 无 PostgreSQL 时可使用 profile：spring.profiles.active=h2（见 application-h2.properties）

# stats 查询窗口上限（天，含首尾日期）
water.stats.max-range-days=365

# 仅本地/联调：为 true 时注册 POST /api/demo/seed-fake-alerts，写入假站点与告警（测 TopN 等）
water.demo-seed.enabled=true

# USGS 63680 浊度绝对阈值：连续 2 个 IV 点（原始行，约 15min）同档超阈才告警；严重：末点≥critical 且前一点≥warn
water.turbidity-threshold.enabled=true
water.turbidity-threshold.cron=0 */15 * * * ?
water.turbidity-threshold.warn-ntu=50
water.turbidity-threshold.critical-ntu=100
water.turbidity-threshold.dedup-hours=6
# water.turbidity-threshold.iv-csv-path=

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Resilience4j Retry：AI 调用重试（初次 + 3 次重试；每次间隔 500ms）
resilience4j.retry.instances.waterAiPredictRetry.max-attempts=4
resilience4j.retry.instances.waterAiPredictRetry.wait-duration=500ms
resilience4j.retry.instances.waterAiPredictRetry.enable-exponential-backoff=false
resilience4j.retry.instances.waterAiPredictRetry.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

# 短时预测 Feign 重试（与 predict 相同策略）
resilience4j.retry.instances.waterAiForecastRetry.max-attempts=4
resilience4j.retry.instances.waterAiForecastRetry.wait-duration=500ms
resilience4j.retry.instances.waterAiForecastRetry.enable-exponential-backoff=false
resilience4j.retry.instances.waterAiForecastRetry.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

# USGS IV 刷新 Feign 重试（NWIS 偶发超时）
resilience4j.retry.instances.waterAiUsgsIvRefreshRetry.max-attempts=4
resilience4j.retry.instances.waterAiUsgsIvRefreshRetry.wait-duration=500ms
resilience4j.retry.instances.waterAiUsgsIvRefreshRetry.enable-exponential-backoff=false
resilience4j.retry.instances.waterAiUsgsIvRefreshRetry.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable
